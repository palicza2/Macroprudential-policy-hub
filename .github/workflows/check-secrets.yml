# Prevent accidental commit of env/secrets
# Runs on every push and PR - fails if .env or similar is tracked
name: Check for secrets

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fail if .env or secrets are tracked
      run: |
        for f in .env .env.local .env.production .env.development; do
          if git ls-files --error-unmatch "$f" 2>/dev/null; then
            echo "ERROR: $f is tracked in git. Remove it immediately."
            exit 1
          fi
        done
        if git ls-files | grep -q '^\.env\.'; then
          echo "ERROR: .env.* file is tracked in git. Remove it immediately."
          exit 1
        fi
        echo "OK: No env files tracked."
