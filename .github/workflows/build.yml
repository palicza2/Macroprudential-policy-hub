name: Build Dashboard

on:
  push:
    branches:
      - master
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow pushing to repository
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Commit and push existing files
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # Only commit if there are changes to commit
        if [ -n "$(git status --porcelain index.html assets/ reports/ figures/ 2>/dev/null)" ]; then
          git add index.html assets/ reports/ figures/ || true
          git commit -m "Auto-update dashboard files [skip ci]" || true
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:master || true
        else
          echo "No changes to commit"
        fi
