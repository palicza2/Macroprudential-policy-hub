name: Build Dashboard

on:
  workflow_dispatch:  # Manual trigger from Actions tab
  schedule:
    - cron: '0 6 1 * *'  # 1st of every month at 06:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow pushing to repository

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t macroprudential-hub:latest .

    - name: Run pipeline
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        CUSTOM_SEARCH_API_KEY: ${{ secrets.CUSTOM_SEARCH_API_KEY }}
        GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        SEARCH_ENABLED: ${{ secrets.SEARCH_ENABLED }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        USE_SUPABASE_FOR_RENDER: ${{ secrets.USE_SUPABASE_FOR_RENDER }}
        ENABLE_SUPABASE: ${{ secrets.ENABLE_SUPABASE }}
        FORCE_REBUILD: ${{ secrets.FORCE_REBUILD }}
      run: |
        docker run --rm \
          -e GOOGLE_API_KEY \
          -e CUSTOM_SEARCH_API_KEY \
          -e GOOGLE_CSE_ID \
          -e SEARCH_ENABLED \
          -e SUPABASE_URL \
          -e SUPABASE_KEY \
          -e SUPABASE_SERVICE_KEY \
          -e USE_SUPABASE_FOR_RENDER \
          -e ENABLE_SUPABASE \
          -e FORCE_REBUILD \
          -v "${{ github.workspace }}:/app" \
          macroprudential-hub:latest

    - name: Commit and push dashboard
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add index.html assets/ reports/ figures/ \
          data/bbm_gold_state.json data/ltv_gold.csv data/dti_expert_table.csv \
          data/bbm_delta_report.json data/bbm_gold_proposals.json \
          data/pipeline_manifest.json data/analyses_cache.json data/countries_data.json \
          data/plots_inline_cache.json data/news_cache.parquet \
          data/processed_*.parquet data/latest_*.parquet data/trend_*.parquet \
          data/reciprocation_*.parquet data/reciprocation_meta.json \
          data/gold_*.parquet 2>/dev/null || true
        if [ -n "$(git status --porcelain -- index.html assets/ reports/ figures/ data/ 2>/dev/null)" ]; then
          git add index.html assets/ reports/ figures/ \
            data/bbm_gold_state.json data/ltv_gold.csv data/dti_expert_table.csv \
            data/bbm_delta_report.json data/bbm_gold_proposals.json \
            data/pipeline_manifest.json data/analyses_cache.json data/countries_data.json \
            data/plots_inline_cache.json data/news_cache.parquet \
            data/processed_*.parquet data/latest_*.parquet data/trend_*.parquet \
            data/reciprocation_*.parquet data/reciprocation_meta.json \
            data/gold_*.parquet
          git commit -m "Auto-update dashboard files [skip ci]"
          git fetch origin master
          git restore . || true
          git rebase origin/master
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:master
        else
          echo "No changes to commit"
        fi
